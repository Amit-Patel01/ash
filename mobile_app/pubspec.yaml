name: mobile_app
description: "SolutionHub Flutter mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  firebase_messaging: ^16.0.2
  cloud_firestore: ^6.0.1
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.4.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  http: ^1.6.0
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo_launcher.png
  adaptive_icon_background: "#06131E"
  adaptive_icon_foreground: assets/branding/logo_launcher.png
  min_sdk_android: 21
  remove_alpha_ios: true
